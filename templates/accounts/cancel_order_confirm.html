{% extends 'base.html' %}

{% block title %}Cancel Order - CampusCrave{% endblock %}

{% block content %}
  <div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
      <h1 style="color: #dc3545; margin-bottom: 1rem;">Cancel Order?</h1>
      
      <p style="color: #666; margin-bottom: 2rem;">
        Are you sure you want to cancel this order?
      </p>
      
      <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
        <h3 style="margin: 0 0 0.5rem 0; color: #333;">{{ reservation.meal.title }}</h3>
        <p style="color: #666; margin: 0;">Order #{{ reservation.id }}</p>
        <p style="color: #ff6b6b; font-size: 1.5rem; font-weight: bold; margin: 1rem 0 0 0;">${{ reservation.total_price }}</p>
      </div>
      
      <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 1rem;">
          <button type="submit" style="flex: 1; padding: 1rem; background: #dc3545; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer;">
            Yes, Cancel Order
          </button>
          <a href="{% url 'accounts:my_orders' %}" class="btn btn-secondary" style="flex: 1; text-align: center; padding: 1rem;">
            Go Back
          </a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
